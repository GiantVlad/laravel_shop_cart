version: "3"

rpc:
  # Used by `rr -c /etc/.rr.yaml reset|status` from inside the container.
  listen: tcp://127.0.0.1:6001

server:
  # RoadRunner is PID 1 in the container and spawns this command as its worker(s), so it must
  # be the Octane *worker* entry point. `php artisan octane:start` is not a worker: it starts a
  # nested RoadRunner server of its own, prints a banner on STDOUT and makes RR abort with
  # "validation failed on the message sent to STDOUT" followed by
  # "rpc_plugin_serve: address -1919: invalid port" (reproduced with rr 2025.1.0).
  command: "php /app/vendor/bin/roadrunner-worker"
  env:
    - XDEBUG_SESSION: 0

http:
  address: :80
  #max_request_size: 256
  middleware: [ "static", "headers", "gzip" ]
  uploads:
    dir: /tmp
    forbid: [ ".php", ".exe", ".bat", ".sh" ]
  headers:
    response:
      X-Powered-By: RoadRunner
  # TLS is terminated by the host NGINX (see .docker/nginx/prod/), so this block stays off:
  # ssl/* is gitignored, meaning a server-side checkout has no certificates and the RoadRunner
  # TLS listener would fail to start.
#  ssl:
#    # force redirect to https connection
#    redirect: false
#    # custom https port (default 443)
#    port: 443
#    # ssl cert
#    cert: /app/ssl/certificate.crt
#    # ssl private key
#    key: /app/ssl/private.key
#    # rootCA certificate path
#    rootCa: /app/ssl/ca_bundle.crt
  static:
    dir: "/app/public"
    forbid: [".htaccess", ".php", ".sql", ".config", "php_errors.log"]
    calculate_etag: false
    weak: false
    allow: [ "" ]
    request:
      input: "custom-header"
    response:
      output: "output-header"
  pool:
    num_workers: 3
    max_jobs: 64
    debug: false

# temporal section removed

# The `reload` plugin was removed from RoadRunner in v2023 - its compatibility guide says to drop
# the section and use *.pool.debug instead. RR 2025 tolerates the key, but it would only start a
# 1s filesystem watcher over /app/app whose contents never change at runtime. After a deploy, use
# `rr -c /etc/.rr.yaml reset` over the rpc plugin above instead.

status:
  # loopback: RR resolves a hostname at bind time, and this endpoint is only read
  # from inside the container (rr status / health probes)
  address: 127.0.0.1:2114
