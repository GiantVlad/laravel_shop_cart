# Host NGINX vhost: shop.cloud-workflow.com -> RoadRunner container.
#
# Topology
#   browser -> host NGINX (TLS termination, this file) -> 127.0.0.1:8089 -> RoadRunner (compose.yaml)
#
# RoadRunner serves both the application and the static files from /app/public, so nothing is
# served from disk here - every request is proxied. Container port stays on loopback, which is
# what compose.yaml publishes:  "127.0.0.1:${DOCKER_RR_80_PORT:-8089}:80"
#
# Install
#   sudo cp shop.cloud-workflow.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/shop.cloud-workflow.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate
#   The 443 server block below expects Let's Encrypt files. Until they exist nginx will refuse
#   to start, so either issue them first
#       sudo certbot certonly --nginx -d shop.cloud-workflow.com
#   or comment the whole `server { listen 443 ... }` block out, reload, run certbot, then put it
#   back. Use your own paths if you already have a certificate.
#
# Notes
#   - gzip is intentionally NOT enabled here: RoadRunner compresses responses itself
#     (http.middleware: ["static","headers","gzip"]) and the client's Accept-Encoding is passed
#     through, so enabling it in nginx would only duplicate work.
#   - WebSockets are not proxied: the app broadcasts to the log driver (BROADCAST_DRIVER=log).
#     Add the Upgrade/Connection pair to the `location /` block if that ever changes.

upstream lara_shop_roadrunner {
    server 127.0.0.1:8089;
    keepalive 16;
}

# Plain HTTP: ACME challenge + everything else redirected to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name shop.cloud-workflow.com;

    # certbot --webroot/--nginx needs this path to stay reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.cloud-workflow.com;

    # nginx >= 1.25.1: use `listen 443 ssl;` plus `http2 on;` instead of the http2 parameter
    # above, which is deprecated in those versions.

    ssl_certificate     /etc/letsencrypt/live/shop.cloud-workflow.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.cloud-workflow.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Maximum request body forwarded to the app (admin image uploads).
    # NOTE: the container's PHP caps uploads at upload_max_filesize=2M / post_max_size=8M, so a
    # larger value here only helps for form posts - raise those in the image as well if product
    # photos need more than 2 MB. RoadRunner's own http.max_request_size is unset (default).
    client_max_body_size 20m;

    # Stay a little above RoadRunner's worker/response times.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Keep X-Powered-By: RoadRunner, drop the nginx version.
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/shop.cloud-workflow.com.access.log;
    error_log  /var/log/nginx/shop.cloud-workflow.com.error.log;

    # Container/host monitoring endpoint (routes/web.php), no access-log noise.
    location = /health {
        access_log off;
        proxy_pass http://lara_shop_roadrunner;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location ^~ /build/assets/ {
        proxy_pass http://lara_shop_roadrunner;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://lara_shop_roadrunner;
        proxy_http_version 1.1;

        # Empty Connection keeps the upstream keepalive pool in use (proper value for this
        # upstream: it is not a WebSocket one).
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # Debug leftovers in routes/web.php. Better still: delete the routes for production; until
    # then they are not reachable from the internet. Comment out if you use /test in smoke runs.
    location = /debug-sentry { return 404; }
    location = /test         { return 404; }

    # Dotfiles (except ACME challenges, handled in the :80 block).
    location ~ /\.(?!well-known) {
        deny all;
    }
}
