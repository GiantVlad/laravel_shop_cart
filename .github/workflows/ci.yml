name: CI

on:
  push:
    branches: [ master, dev2 ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: 'read'

jobs:
  composer-validate:
    runs-on: ubuntu-24.04
    name: "Composer Validate"
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: none
          tools: composer:v2

      - name: 'Validate composer.json'
        run: composer validate --no-check-all --strict --no-check-lock

  static-analysis:
    needs: composer-validate
    runs-on: ubuntu-24.04
    name: "Static Analysis"
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
          extensions: grpc

      - name: 'Install PHP dependencies with Composer'
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      # No path argument on purpose: phpstan.neon defines the analysed scope (app/) and includes
      # phpstan-baseline.neon, so this fails only on *new* errors. Passing ./ analysed the whole
      # repo (including untyped factories and Blade templates) and was 208 errors.
      - name: 'Run PHPStan'
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress -c phpstan.neon

  test:
    needs: composer-validate
    runs-on: ubuntu-24.04
    name: "Test Backend"
    services:
      mariadb:
        image: mariadb:11.7.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: shop_test
          MARIADB_USER: admin
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      # The service container is reached on the runner's localhost, not by its service name -
      # this is also why phpunit.xml must not force DB_HOST (it still forces DB_DATABASE=shop_test).
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: shop_test
      DB_USERNAME: admin
      DB_PASSWORD: secret
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup PHP'
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          ini-values: memory_limit=-1
          coverage: none
          tools: composer:v2
          extensions: grpc

      - name: 'Install PHP dependencies with Composer'
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      # No database preparation step: the mariadb service creates shop_test on first boot and
      # phpunit.xml forces DB_DATABASE=shop_test (with array/sync cache, session and queue drivers,
      # so no redis service is needed). The suite runs `migrate:fresh` itself via RefreshDatabase.
      - name: 'Execute tests (Unit and Feature tests) via PHPUnit'
        run: php artisan test

  frontend:
    runs-on: ubuntu-24.04
    name: "Build Frontend"
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@v4

      - name: 'Setup Node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 'Install dependencies'
        run: npm ci
        working-directory: frontend

      # Repo has no JS test runner, so this is the frontend gate: fail on a high-severity advisory
      # in the build toolchain (currently 0) ...
      - name: 'Audit dependencies'
        run: npm audit --audit-level=high
        working-directory: frontend

      # ... and prove the bundle still builds.
      - name: 'Build bundle'
        run: npm run build
        working-directory: frontend

      # public/build is committed and RoadRunner serves it in production, so a stale bundle would
      # deploy silently. Verified reproducible: a fresh `npm ci && npm run build` produces
      # byte-identical assets.
      - name: 'Check the committed bundle is up to date'
        run: |
          if ! git diff --exit-code --stat -- public/build; then
            echo "::error::public/build is stale - run 'npm run build' in frontend/ and commit the result"
            exit 1
          fi
