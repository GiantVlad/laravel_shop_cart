services:
  roadrunner:
    #image: gaintvlad/lara_shop_roadrunner:1.001
    build:
      context: ./
      dockerfile: ./.docker/roadrunner/Dockerfile
      args:
        RR_VERSION: ${RR_VERSION}
        PHP_IMAGE_VERSION: ${PHP_IMAGE_VERSION}
    ports:
      - "80:80"
      - "443:443"
      - "6001:6001"
    env_file: .env
    environment:
#      RR_VERSION: ${RR_VERSION}
      APP_BASE_PATH: /app
      PHP_IDE_CONFIG: "serverName=roadrunner.local"
    working_dir: /app
    depends_on:
      - mariadb
    restart: on-failure
    healthcheck:
      disable: true
#    healthcheck:
#      interval: 1s
#      timeout: 3s
#      retries: 3
#      start_period: 10s
    volumes:
      #- app_content:/app
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mariadb:
    image: mariadb:11.7.2
    restart: unless-stopped
    environment:
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=rootsecret123
      - MARIADB_DATABASE=shop
    ports:
      - '${DOCKER_MYSQL_PORT:-3307}:3306'
    volumes:
      # .local_data/sql holds the old bitnami layout and is no longer used by this image (whose
      # data directory is /var/lib/mysql), so the dev data currently lives in an anonymous
      # volume. To persist it, point this at a fresh path and recreate + migrate + seed:
      #   - './.local_data/mariadb:/var/lib/mysql'
      - './.local_data/sql:/bitnami/mariadb'
      # Creates the shop_test database used by PHPUnit (only on a fresh data directory).
      - './.docker/mariadb/init:/docker-entrypoint-initdb.d:ro'

  # The test suite used to run against a second container (mariadb_test, port 3308). It was removed
  # in favour of the shop_test database inside the mariadb container above: same isolation for
  # RefreshDatabase, one less service, one less port. Re-add it here if you ever need two engines.

  redis:
    image: redis:6.2.5-alpine
    restart: unless-stopped
    ports:
      - '${DOCKER_REDIS_PORT:-6380}:6379'
    command:
      - '--appendonly yes'
      - '--databases'
      - '512'
    volumes:
      - './.local_data/redis:/data'

  mailhog:
    image: mailhog/mailhog
    restart: on-failure
    environment:
      MH_UI_WEB_PATH: mailhog
    ports:
      - '8025:8025'

volumes:
  app_content:
