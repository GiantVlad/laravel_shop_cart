services:
  roadrunner:
    #image: gaintvlad/lara_shop_roadrunner:1.001
    build:
      context: ./
      dockerfile: ./.docker/roadrunner/Dockerfile
      args:
        RR_VERSION: ${RR_VERSION}
        PHP_IMAGE_VERSION: ${PHP_IMAGE_VERSION}
    ports:
      - "80:80"
      - "443:443"
      - "6001:6001"
    env_file: .env
    environment:
#      RR_VERSION: ${RR_VERSION}
      APP_BASE_PATH: /app
      PHP_IDE_CONFIG: "serverName=roadrunner.local"
    working_dir: /app
    depends_on:
      - mariadb
    restart: on-failure
    healthcheck:
      disable: true
#    healthcheck:
#      interval: 1s
#      timeout: 3s
#      retries: 3
#      start_period: 10s
    volumes:
      #- app_content:/app
      - ./:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mariadb:
    image: mariadb:11.7.2
    restart: unless-stopped
    environment:
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=rootsecret123
      - MARIADB_DATABASE=shop
      - MARIADB_SKIP_TEST_DB=yes
    ports:
      - '${DOCKER_MYSQL_PORT:-3307}:3306'
    volumes:
      - './.local_data/sql:/bitnami/mariadb'

  mariadb_test:
    image: mariadb:11.7.2
    restart: unless-stopped
    environment:
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=rootsecret123
      - MARIADB_DATABASE=shop
      - MARIADB_SKIP_TEST_DB=yes
    ports:
      - '${DOCKER_MYSQL_TEST_PORT:-3308}:3306'
    volumes:
      - './.local_data/test_sql:/bitnami/mariadb'

  redis:
    image: redis:6.2.5-alpine
    restart: unless-stopped
    ports:
      - '${DOCKER_REDIS_PORT:-6380}:6379'
    command:
      - '--appendonly yes'
      - '--databases'
      - '512'
    volumes:
      - './.local_data/redis:/data'

  mailhog:
    image: mailhog/mailhog
    restart: on-failure
    environment:
      MH_UI_WEB_PATH: mailhog
    ports:
      - '8025:8025'

volumes:
  app_content:
