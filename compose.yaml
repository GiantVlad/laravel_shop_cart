version: '3'
services:
  roadrunner:
    #image: gaintvlad/lara_shop_roadrunner:1.001
    build:
      context: ./
      dockerfile: ./.docker/roadrunner/DockerfileProd
      args:
        RR_VERSION: ${RR_VERSION}
        PHP_IMAGE_VERSION: ${PHP_IMAGE_VERSION}
    image: ul1acr.azurecr.io/lara_shop/l_roadrunner
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
    ports:
      - "80:80"
    env_file: .env.prod
    environment:
      #      RR_VERSION: ${RR_VERSION}
      APP_BASE_PATH: /app
      #PHP_IDE_CONFIG: "serverName=roadrunner.local"
    working_dir: /app
    depends_on:
      - mariadb
    restart: on-failure
    #    healthcheck:
    #      interval: 1s
    #      timeout: 3s
    #      retries: 3
    #      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mariadb:
    image: bitnami/mariadb:11.7.2
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
    environment:
      - MARIADB_USER=admin
      - MARIADB_PASSWORD=secret
      - MARIADB_ROOT_PASSWORD=rootsecret123
      - MARIADB_DATABASE=shop
      - MARIADB_SKIP_TEST_DB=yes
#    ports:
#      - '${DOCKER_MYSQL_PORT:-3307}:3306'
#    volumes:
#      - './.local_data/sql:/bitnami/mariadb'

#  mariadb_test:
#    image: bitnami/mariadb:10
#    restart: unless-stopped
#    environment:
#      - MARIADB_USER=admin
#      - MARIADB_PASSWORD=secret
#      - MARIADB_ROOT_PASSWORD=rootsecret123
#      - MARIADB_DATABASE=shop
#      - MARIADB_SKIP_TEST_DB=yes
#    ports:
#      - '${DOCKER_MYSQL_TEST_PORT:-3308}:3306'

  redis:
    image: redis:6.2.5-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G
#    ports:
#      - '${DOCKER_REDIS_PORT:-6380}:6379'
#    command:
#      - '--appendonly yes'
#      - '--databases'
#      - '512'
#    volumes:
#      - './.local_data/redis:/data'

